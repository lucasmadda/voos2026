[project]
name = "voos"
version = "0.1.0"
description = "voos2026 — cancelamentos e atrasos de voos no Brasil × meteorologia × perfil eleitoral do destino"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.6",
  "pyarrow==26.0.0",
  "httpx==0.28.1",
  "certifi",
  "remotezip==0.12.6",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
ld = ["pyshacl", "rdflib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["pipeline"]
